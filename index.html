    [startButton,instrumentSelect,questionTypeSelect,noteCountSelect,firstNoteControls].forEach(control=>{control.disabled=false;});
    replayButton.disabled=true;playChordBtn.disabled=true;replayButton.textContent=t('replayBtn');
    settingsPopup.classList.remove('active');
    updateUIControls();updateStartButton();setStatus(null,t('initialMsg'));setBoardScroll(0);syncArcadeUI();
    document.body.classList.remove('game-cleared');endingDialog.close();startButton.focus();
  }
  endingOK.addEventListener('click',returnToGameStart);


  // A modal keeps the result paused until the player answers and the reply finishes.
  const challengeDialog=document.createElement('dialog');
  challengeDialog.className='ending-dialog challenge-dialog';
  challengeDialog.setAttribute('aria-labelledby','challenge-title');
  challengeDialog.innerHTML='<h2 id="challenge-title">30 COMBO!</h2>';
  const challengeCharacter=document.createElement('img');
  challengeCharacter.className='ending-character';challengeCharacter.src=mascotImage;
  challengeCharacter.alt='海の魔法使い・コーラル';
  const challengeSpeech=document.createElement('div');
  challengeSpeech.className='oni-speech';challengeSpeech.setAttribute('aria-live','polite');
  const challengeChoices=document.createElement('div');
  challengeChoices.className='challenge-choices';
  const challengeYes=document.createElement('button'),challengeNo=document.createElement('button');
  challengeYes.type=challengeNo.type='button';
  challengeYes.textContent='はい';challengeNo.textContent='いいえ';
  challengeChoices.append(challengeYes,challengeNo);
  challengeDialog.append(challengeCharacter,challengeSpeech,challengeChoices);
  document.body.append(challengeDialog);
  challengeDialog.addEventListener('cancel',event=>event.preventDefault());
  let challengeAnswered=false;
  let challengeMode='chord';
  let challengeSavedControls=[];
  function beginRootChallenge() {
    clearArcade();
    challengeActive=true;challengeAnswered=false;
    challengeMode=game.mode;
    challengeDialog.classList.remove('challenge-reply');
    challengeSpeech.textContent=appSettings.lang==='on'?'Was that a little too easy?':'ちょっと簡単すぎたかなぁ？';
    challengeYes.textContent=appSettings.lang==='on'?'Yes':'はい';
    challengeNo.textContent=appSettings.lang==='on'?'No':'いいえ';
    challengeChoices.hidden=false;
    challengeYes.disabled=challengeNo.disabled=false;
    const controls=[startButton,replayButton,playChordBtn,instrumentSelect,questionTypeSelect,noteCountSelect,firstNoteControls];
    challengeSavedControls=controls.map(control=>[control,control.disabled]);
    controls.forEach(control=>{control.disabled=true;});
    setTimeout(()=>{
      if(!challengeActive) return;
      challengeDialog.showModal();challengeYes.focus();
    },1000);
  }
  function answerRootChallenge(harder) {
    if(!challengeActive || challengeAnswered) return;
    challengeAnswered=true;
    challengeDialog.classList.add('challenge-reply');
    challengeYes.disabled=challengeNo.disabled=true;
    challengeChoices.hidden=true;
    challengeSpeech.textContent=appSettings.lang==='on' ? (harder?'Then try this!':"You're on a roll! Keep it up!") : (harder?'じゃあ、これはどうだ～！':'その調子でがんばって！');
    setTimeout(()=>{
      if(harder) {
        if(challengeMode==='melody') appSettings.melodyJazz='on';
        else appSettings.firstNote='random';
        updateSettingsUI();
      }
      challengeActive=false;
      challengeSavedControls.forEach(([control,disabled])=>{control.disabled=disabled;});
      challengeSavedControls=[];
      challengeDialog.close();syncArcadeUI();startButton.focus();
    },3000);
  }
  challengeYes.addEventListener('click',()=>answerRootChallenge(true));
  challengeNo.addEventListener('click',()=>answerRootChallenge(false));

  // Cancel celebrations before any new listening or note input.
  function cancelArcadeForInput() { clearTimeout(judgmentTimer); clearArcade(); }
  [startButton,replayButton,playChordBtn,instrumentSelect,questionTypeSelect,noteCountSelect].forEach(el=>{
    el.addEventListener('click',cancelArcadeForInput,true);
    el.addEventListener('change',cancelArcadeForInput,true);
  });
  svg.addEventListener('pointerdown',cancelArcadeForInput,true);
  svg.addEventListener('keydown',cancelArcadeForInput,true);
  soundNoneBtn.addEventListener('click',()=>{ clearTimeout(judgmentTimer); stopArcadeAudio(); });
  window.addEventListener('blur',clearArcade);
  document.addEventListener('visibilitychange',()=>{if(document.hidden) clearArcade();});
  const arcadeObserver = new MutationObserver(syncArcadeUI);
  arcadeObserver.observe(statusBox,{childList:true,subtree:true,attributes:true});
  arcadeObserver.observe(startButton,{attributes:true,attributeFilter:['disabled']});
  [langOnBtn,langOffBtn].forEach(el=>el.addEventListener('click',syncArcadeUI));
  document.addEventListener('visibilitychange',()=>{
    document.body.classList.toggle('page-hidden',document.hidden);
    if(document.hidden) {
      clearTimeout(audioIdleTimer);
      setTimeout(()=>{
        if(document.hidden && audioContext?.state==='running') audioContext.suspend().catch(()=>{});
      },150);
    }
  });
  instrumentSelect.addEventListener('change', () => {
    if (instrumentSelect.value === instrumentMode) return;
    clearTimeout(judgmentTimer);
    clearArcade();
    endGesture();
    stopHeldNote(currentHeldPosition);
    activeVoices.forEach(stop => stop());
    clearTimeout(playingTimeoutId);
    playingTimeoutId = null;
    lastPlayingCell = null;
    scrollGesture = null;
    instrumentMode = instrumentSelect.value;
    strings = makeStrings();
    difficultyStates = instrumentProgress[instrumentMode].difficulty;
    feverPeaks = instrumentProgress[instrumentMode].fever;
    oniCompleted = instrumentProgress[instrumentMode].oni;
    scaleDeck = []; chordTypeBag = []; lastChordName = lastChordShape = null;
    melodyTypeBag = []; melodyTypeRule = null; lastMelodyKey = null;
    recentMelodyShapes.length = recentMelodyIds.length = 0;
    game = { mode:questionTypeSelect.value, phase:'idle', target:[], answers:[], titleName:'', displayKey:'', rootPitchIndex:-1, chordMidiNotes:[] };
    celebrationKind = 'normal';
    buildFretboard();
    setBoardScroll(0);
    startButton.disabled = false;
    replayButton.disabled = true;
    replayButton.textContent = t('replayBtn');
    updateUIControls(); updateStartButton(); setStatus(null, t('initialMsg')); syncArcadeUI();
  });
  updateUIControls();
  updateSettingsUI();
  updateStaticTexts();
  syncArcadeUI();

  function showPopupFromTop(dialog,heading){
    dialog.showModal();
    heading.focus({preventScroll:true});
    dialog.scrollTop=0;
    requestAnimationFrame(()=>{if(dialog.open) dialog.scrollTop=0;});
  }
  // Keep option indexes for the existing language controls while restricting the trial.
  [questionTypeSelect,noteCountSelect].forEach(select=>{
    [...select.options].slice(1).forEach(option=>{option.disabled=true;option.hidden=true;});
  });
  const trialBar=document.createElement('div');trialBar.className='trial-bar';
  const trialLabel=document.createElement('span');
  const trialHelp=document.createElement('button');trialHelp.type='button';
  trialBar.append(trialLabel,trialHelp);document.querySelector('.studio-header').after(trialBar);
  const trialIntro=document.createElement('dialog');trialIntro.className='trial-dialog';trialIntro.setAttribute('aria-labelledby','trial-title');
  const coral=document.createElement('img');coral.src=mascotImage;coral.alt='海の魔法使い・コーラル';
  const introTitle=document.createElement('h2');introTitle.id='trial-title';introTitle.tabIndex=-1;introTitle.setAttribute('autofocus','');
  const introText=document.createElement('p');
  const introPath=document.createElement('p');introPath.className='trial-path';
  const introFull=document.createElement('p');
  const introStart=document.createElement('button');introStart.type='button';introStart.className='primary-btn';
  const introLanguages=document.createElement('div');introLanguages.className='trial-languages';introLanguages.setAttribute('role','group');
  const introJapanese=document.createElement('button');introJapanese.type='button';introJapanese.textContent='日本語';
  const introEnglish=document.createElement('button');introEnglish.type='button';introEnglish.textContent='English';
  introLanguages.append(introJapanese,introEnglish);
  function selectTrialLanguage(lang){
    appSettings.lang=lang;updateSettingsUI();updateStaticTexts();syncArcadeUI();
    trialIntro.scrollTop=0;
  }
  introJapanese.addEventListener('click',()=>selectTrialLanguage('off'));
  introEnglish.addEventListener('click',()=>selectTrialLanguage('on'));
  trialIntro.append(coral,introTitle,introLanguages,introText,introPath,introFull,introStart);document.body.append(trialIntro);
  function updateTrialText(){
    const en=appSettings.lang==='on';
    trialLabel.textContent=en?'TRIAL · Chord / 2 notes · 15 questions per round':'お試し版 · コード／2音 · 全15問';
    trialHelp.textContent=en?'Coral’s guide':'コーラルのガイド';
    introTitle.innerHTML=en?'Welcome! I’m Coral.':'こんにちは！<span class="coral-greeting"> コーラルだよ♪</span>';
    coral.alt=en?'Coral, the sea magician':'海の魔法使い・コーラル';
    introLanguages.setAttribute('aria-label',en?'Language':'言語');
    introJapanese.setAttribute('aria-pressed',String(!en));introEnglish.setAttribute('aria-pressed',String(en));
    introText.textContent=en?'Press Start Game, listen to the two notes, then tap the fretboard in the order you heard them. Follow the on-screen prompts. Listen Again and Show Answer can help you practice.':'「問題を出す」を押して2つの音を聴いたら、画面の案内に合わせて、聴こえた順に指板をタップしてね。「もう一度聴く」「正解を確認する」も使って練習しよう！';
    introPath.textContent=en?'5 in a row: FEVER → 10: SUPER HOT · Results after 15 questions':'5連続でフィーバー → 10連続で激アツ！ 全15問で結果発表';
    introFull.textContent=en?'Every round ends after 15 answers, including mistakes. Mistakes reset your streak, and you can replay as often as you like. All three instruments and settings are available. Streaks are tracked per instrument. The full version adds 3/4-note chords, scales and melodies. Purchase link coming soon.':'正解・不正解にかかわらず15問で結果発表だよ。間違えたら連続正解は0から再スタート。何度でも再チャレンジしてね。楽器3種類や速度などの設定は全部使えるよ！ 連続正解は楽器ごとに記録されるよ。フル版では3音・4音のコード、スケール、メロディにも挑戦できるんだ♪ 購入リンクは準備中だよ。';
    introStart.textContent=en?'Let’s play!':'さっそく遊ぶ';
  }
  introStart.addEventListener('click',()=>{trialIntro.close();startButton.focus();});
  trialHelp.addEventListener('click',()=>{updateTrialText();showPopupFromTop(trialIntro,introTitle);});
  const originalUpdateStaticTexts=updateStaticTexts;
  updateStaticTexts=function(){originalUpdateStaticTexts();updateTrialText();};
  updateTrialText();showPopupFromTop(trialIntro,introTitle);

  </script>

</body>
</html>

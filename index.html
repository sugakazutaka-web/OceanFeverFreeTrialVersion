:root { --orange:#e6bd89;  --accent-border:#826649; --board-crop:38.8235294117647px; color-scheme:dark; font-family:ui-rounded,"Hiragino Sans",system-ui,sans-serif;}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body { margin:0; -webkit-text-size-adjust:100%;}
.app-viewport-wrapper { width:100%;}
main { width:100%; max-width:940px; margin:auto; padding:0 max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
.controls { position:sticky; top:0; z-index:20; padding:max(10px,env(safe-area-inset-top)) 0 6px; background:#000; display:flex; flex-direction:column; gap:10px;}

.action-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%;}
button,select { font:inherit; font-size:16px; border-radius:12px; min-height:46px; border:1px solid #49483e; padding:9px 10px; touch-action:manipulation;}
button { font-weight:750; cursor:pointer;}
button:active { filter:brightness(.85);}
button:disabled,select:disabled { opacity:.45; cursor:default;}
button:focus-visible,.cell:focus-visible { outline:3px solid #9ddcff; outline-offset:2px;}
select { border-width:2px; width:100%; min-width:0;}
#question-type:focus, #note-count:focus { outline:none; border-color:var(--accent-border); box-shadow:none;}
.status-container { width:100%; display:flex; flex-direction:column; gap:6px;}
.chord-row { display:flex; align-items:center; justify-content:space-between; gap:10px; border:2px solid #594735; padding:5px 12px; border-radius:14px; min-height:56px;}
.status-label { font-size:10px; letter-spacing:.12em;}
#target-title { font-size:21px; font-weight:800; overflow-wrap:anywhere;}
.small-btn { font-size:13px; flex-shrink:0;}
#play-chord-arpeggio { min-height:36px; height:36px; padding:5px 10px; line-height:24px; white-space:nowrap; border-color:#e5c39a;}

#status-box { min-height:52px; margin:0; padding:8px 12px; border:2px solid #494038; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:800;}
.settings-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; position:relative;}
.control-group { display:flex; align-items:center; gap:6px; font-size:12px; min-width:0;}
.control-group label { flex-shrink:0;}
#label-q-type, #label-note-count { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;}
#first-note-group { min-width:0;}
#first-note-mode { border:0; padding:0; margin:0; min-width:0;}
#note-count-group { flex:0 0 auto; gap:4px;}
#question-type-group { gap:4px; flex-shrink:0;}
#question-type { width:auto; flex-shrink:0;}
#note-count { width:auto; flex-shrink:0;}
.settings-btn { font-size:13px; padding-inline:8px; border-width:2px; background:#343e43; border-color:#637078; color:#e0e5e7;}
.settings-popup { display:none; position:absolute; top:52px; left:0; z-index:30; width:min(340px,100%); padding:12px; background:#000; border:1px solid var(--accent-border); border-radius:16px; box-shadow:0 12px 40px #0009;}
.settings-popup.active { display:flex; flex-direction:column; gap:10px;}
.settings-popup h3 { margin:0; font-size:16px;}
.setting-item label { display:block; margin-bottom:6px; font-size:13px;}
.settings-popup .setting-item label { margin-bottom:4px;}
.settings-popup .setting-opt-btn { min-height:40px; padding:7px 8px;}
@media(max-height:500px) and (min-width:480px) {

  .settings-popup h3 { grid-column:1 / -1; }
}
.setting-options { display:flex; gap:6px;}
.setting-opt-btn { flex:1; font-size:13px; border-width:2px;}
.setting-opt-btn.active { box-shadow:none;}
.board-shell { width:100%; overflow-x:auto; overflow-y:hidden; border-radius:14px; overscroll-behavior-x:contain; touch-action:none; scrollbar-width:none;}
.board-shell::-webkit-scrollbar { display:none; width:0; height:0;}
.board-track { display:flex; width:calc(900px - var(--board-crop));}
.board-crop { flex:0 0 calc(900px - var(--board-crop)); width:calc(900px - var(--board-crop)); height:206px; overflow:hidden;}
#fretboard { display:block; margin-top:-44px; margin-left:calc(0px - var(--board-crop)); width:900px; height:300px;}
.board-shell,.board-shell * { touch-action:none; -webkit-touch-callout:none!important; -webkit-user-select:none!important; user-select:none!important; -webkit-user-drag:none;}
.root-marker { stroke-width:2.5; pointer-events:none;}
.note { font-size:12px; font-weight:750; text-anchor:middle; pointer-events:none;}
.string-name { font-size:16px; font-weight:800; text-anchor:end; pointer-events:none;}
.hint { margin-top:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:12px; color:#b7ac9c;}
#deck-counter { width:100%; text-align:center; font-size:20px; line-height:1.5; font-weight:750; border:1px solid var(--accent-border); border-radius:10px; padding:6px 12px;}
#deck-counter.hard-mode { width:100%; text-align:center; border:2px solid #f276b0;}
.board-navigation { padding:4px 0 0;}
.scroll-pad { min-height:48px; padding:8px 12px; gap:10px; display:flex; align-items:center; justify-content:center; border:1px solid #494038; border-radius:10px; font-size:14px; font-weight:500; cursor:grab; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
.scroll-pad:active { cursor:grabbing;}
.scroll-arrow { font-size:28px; line-height:1; flex-shrink:0;}
.scroll-pad:focus-visible { outline:2px solid var(--orange); outline-offset:2px;}
@media(min-width:700px) { .action-row { max-width:520px; } }
@media(max-width:360px) { .settings-row { gap:4px; } .action-row button { font-size:13px; padding:9px 4px; } }

/* Landscape workspace: fit the available browser height, including tablet chrome. */
@media (min-width: 651px) and (orientation: landscape) {
  body { min-height:100svh; }
  main {
    width:100%; max-width:1440px;
    height:100vh; height:100dvh; min-height:560px;
    padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
    grid-template-columns:minmax(0,1fr) minmax(370px,.88fr);
    grid-template-rows:42px 250px minmax(0,1fr) 24px;
    gap:12px 16px;
  }
  .studio-header { padding:0 0 10px; }
  .brand-icon { width:32px; height:32px; border-radius:9px; }
  .brand-name { font-size:19px; }
  .brand-sub { font-size:8px; letter-spacing:1.8px; }
  .header-tag { font-size:9px; }
  .top-controls { min-height:0; padding:16px 20px; gap:12px; border-radius:16px; justify-content:space-between; }
  .top-controls:before { font-size:9px; }
  .status-container { gap:10px; }
  .chord-row { min-height:56px; flex-direction:row; align-items:center; gap:10px; }
  #target-title { font-size:clamp(26px,3.1vw,42px); line-height:1.15; letter-spacing:-1px; }
  #play-chord-arpeggio { font-size:11px; min-height:40px; height:40px; padding:6px 9px; }
  #status-box { min-height:44px; padding:8px 12px; font-size:12px; line-height:1.5; }
  .action-row { grid-template-columns:1.1fr 1fr; gap:8px; }
  .action-row button { min-height:46px; padding:8px; font-size:12px; }
  .settings-row { padding:14px 16px; gap:8px 12px; border-radius:16px; align-content:start; }
  .settings-row:before { font-size:9px; margin:0; }
  .control-group { gap:4px!important; }
  #label-q-type,#label-note-count { font-size:10px; }
  select { min-height:40px; font-size:12px; padding:6px 10px; }
  .settings-popup,.settings-popup.active { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; padding:10px 0 0; }
  .setting-item { min-width:0; }
  .setting-item label { font-size:10px; margin-bottom:5px!important; }
  .settings-popup .setting-opt-btn { min-height:40px; font-size:10px; padding:5px 4px; }
  .instrument { padding:12px 16px; border-radius:16px; display:grid; grid-template-rows:16px minmax(0,1fr) 24px 12px; gap:5px; min-height:0; }
  .instrument-heading { margin:0; }
  .instrument-title { font-size:10px; }
  .instrument-spec { font-size:9px; }
  .board-shell { min-height:0; }
  .board-track { width:100%; height:100%; }
  .board-crop { width:100%; height:100%; flex:1; min-width:0; }
  #fretboard { width:100%; height:100%; margin:0; }
  .board-navigation { padding:0; }
  .scroll-pad { min-height:24px; height:24px; font-size:10px; }
  .scroll-arrow { font-size:18px; }
  .instrument-legend { margin:0; font-size:9px; }
  .hint { align-self:center; }
  #deck-counter,#deck-counter.hard-mode { padding:2px 10px; font-size:11px; line-height:18px; text-align:center; border-width:1px; box-shadow:none; }
  .studio-footer { display:none; }
}
@media (min-width:651px) and (max-width:850px) and (orientation:landscape) {
  main { padding-left:12px; padding-right:12px; grid-template-columns:minmax(0,1fr) 350px; gap:10px; }
  .header-tag { display:none; }
  .top-controls { padding:14px; }
  .chord-row { gap:6px; }
  #target-title { font-size:25px; }
  #play-chord-arpeggio { font-size:10px; padding:5px; }
}

@media(min-width:651px) and (orientation:landscape){main{grid-template-rows:42px auto minmax(310px,auto) minmax(180px,1fr) auto;height:auto;min-height:100dvh}.top-controls,.settings-row{grid-row:3}}


/* Let desktop settings determine their own height, including wrapped translations. */
@media(min-width:651px) and (orientation:landscape){

  <script>

    // Safari gesture events complement touch-action without suppressing single taps.
    const preventNativeGesture = event => { if (event.cancelable) event.preventDefault(); };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(type =>
      document.addEventListener(type, preventNativeGesture, { passive:false }));
    ['touchstart', 'touchmove'].forEach(type => document.addEventListener(type, event => {
      if (event.touches.length > 1) preventNativeGesture(event);
    }, { passive:false }));
    document.addEventListener('selectstart', preventNativeGesture);
    document.addEventListener('contextmenu', event => {
      if (window.matchMedia('(pointer:coarse)').matches) preventNativeGesture(event);
    });
    const svg = document.querySelector('#fretboard');
    const statusBox = document.querySelector('#status-box');
    const statusMessage = document.querySelector('#status-message');
    const targetTitle = document.querySelector('#target-title');
    const targetLabel = document.querySelector('#target-label');
    const playChordBtn = document.querySelector('#play-chord-arpeggio');
    const startButton = document.querySelector('#start');
    const replayButton = document.querySelector('#replay');
    const questionTypeSelect = document.querySelector('#question-type');
    const instrumentSelect = document.querySelector('#instrument-select');
    const noteCountSelect = document.querySelector('#note-count');
    const firstNoteControls = document.querySelector('#first-note-mode');
    const noteCountGroup = document.querySelector('#note-count-group');
    const firstNoteGroup = document.querySelector('#first-note-group');
    const deckCounter = document.querySelector('#deck-counter');

    // 設定ポップアップメニュー関連要素
    const openSettingsBtn = document.querySelector('#open-settings');
    const settingsPopup = document.querySelector('#settings-popup');
    const speedSlowBtn = document.querySelector('#speed-slow-btn');
    const speedFastBtn = document.querySelector('#speed-fast-btn');
    const soundNoneBtn = document.querySelector('#sound-none-btn');
    const soundExistsBtn = document.querySelector('#sound-exists-btn');
    const langOffBtn = document.querySelector('#lang-off-btn');
    const langOnBtn = document.querySelector('#lang-on-btn');

    // 多言語テキスト辞書
    const i18n = {
      ja: {
        settings: "⚙️ 設定",
        langLabel: "English",
        speedLabel: "問題の再生スピード",
        speedSlow: "遅い",
        speedFast: "速い",
        soundLabel: "正誤判定のサウンド",
        soundExists: "あり",
        soundNone: "なし",
        qType: "問題:",
        optChord: "コード",
        optScale: "スケール",
        optMelody: "メロディ",
        noteCount: "音数:",
        opt2: "2音",
        opt3: "3音",
        opt4: "4音",
        firstNote: "コード問題の最初の音",
        optRoot: "ルート音",
        optRandom: "ルート音以外",
        startBtn: "▶ 問題を出す",
        skipBtn: "⏭ スキップ",
        replayBtn: "🔊 もう一度聴く",
        viewResultBtn: "👁️ 正解を確認する",
        playChordBtn: "🎸 コードを鳴らす",
        initialMsg: "「問題を出す」を押してください",
        chordTitleLabel: "コード名",
        scaleTitleLabel: "スケール名",
        chordPlaying: "和音を再生中…",
        scalePlaying: "キー音再生中・・・",
        firstNoteGuessPrompt: "1音目の音: フレットボードから音を選んでください",
        listenCarefully: (i, total) => `よく聴いてください… (${i} / ${total}音目)`,
        guessNextPrompt: (curr, total) => `次の音をクリックしてください（${curr} / ${total}）`,
        guessFirstPrompt: (total) => `聴こえた順に、フレットを${total}つクリックしてください（1 / ${total}）`,
        correctMsg: "🎉 正解！",
        wrongMsg: "❌ 不正解。",
        replayCorrecting: (i) => `${i}音目：正解位置を再生中…`
      },
      en: {
        settings: "⚙️ Settings",
        langLabel: "English",
        speedLabel: "Playback Speed",
        speedSlow: "Slow",
        speedFast: "Fast",
        soundLabel: "Judgment Sound",
        soundExists: "On",
        soundNone: "None",
        qType: "Mode:",
        optChord: "Chord",
        optScale: "Scale",
        optMelody: "Melody",
        noteCount: "Notes:",
        opt2: "2 Notes",
        opt3: "3 Notes",
        opt4: "4 Notes",
        firstNote: "First Note of Chord Questions",
        optRoot: "Root Note",
        optRandom: "Non-root Note",
        startBtn: "▶ Start Game",
        skipBtn: "⏭ Skip",
        replayBtn: "🔊 Listen Again",
        viewResultBtn: "👁️ Show Answer",
        playChordBtn: "🎸 Play Chord",
        initialMsg: "Click 'Start Game' to begin",
        chordTitleLabel: "CHORD",
        scaleTitleLabel: "SCALE",
        chordPlaying: "Playing chord...",
        scalePlaying: "Playing key note...",
        firstNoteGuessPrompt: "1st Note: Select a note from the fretboard",
        listenCarefully: (i, total) => `Listen carefully... (${i} / ${total})`,
        guessNextPrompt: (curr, total) => `Click the next note (${curr} / ${total})`,
        guessFirstPrompt: (total) => `Click ${total} notes in the order you hear them (1 / ${total})`,
        correctMsg: "🎉 Correct!",
        wrongMsg: "❌ Incorrect.",
        replayCorrecting: (i) => `Note ${i}: Playing correct position...`
      }
    };

    // 設定状態の管理
    let appSettings = {
      firstNote: 'root',
      melodyJazz: 'off',
      speed: 'slow',
      sound: 'exists',
      lang: 'off'
    };

    function t(key, ...args) {
      const activeLang = appSettings.lang === 'on' ? 'en' : 'ja';
      const dict = i18n[activeLang] || i18n.ja;
      const val = dict[key];
      if (typeof val === 'function') {
        return val(...args);
      }
      return val || i18n.ja[key] || key;
    }

    function updateInstrumentTexts() {
      const english = appSettings.lang === 'on';
      document.querySelector('#label-instrument').textContent = english ? 'Instrument:' : '楽器:';
      instrumentSelect.options[0].textContent = english ? 'Guitar' : 'ギター';
      instrumentSelect.options[1].textContent = english ? 'Bass (+1 OCT)' : 'ベース（+1 OCT）';
      instrumentSelect.options[2].textContent = english ? 'Original Tone' : 'オリジナル・トーン';
      document.querySelector('.instrument-spec').textContent = `${strings.length} STRINGS · ${frets} FRETS · ${[...instrument().names].reverse().join(' ')}`;
      svg.setAttribute('aria-label', english ? `${strings.length}-string ${instrumentMode} fretboard` : instrumentMode === 'guitar' ? '6弦ギターのフレットボード' : '4弦エレクトリックベースのフレットボード');
      positions.forEach(pos => pos.cell.setAttribute('aria-label', english
        ? `String ${pos.string.number} ${pos.string.name}, fret ${pos.fret}, ${noteName(pos.midi)}`
        : `${pos.string.number}弦 ${pos.string.name} ${pos.fret}フレット ${noteName(pos.midi)}`));
    }

    function updateStaticTexts() {
      updateInstrumentTexts();
      document.querySelector('#scroll-description').textContent = appSettings.lang === 'on' ? 'Swipe here to move the fretboard left or right' : '指板の左右移動はここをスワイプ';
      document.querySelector('#scroll-pad').setAttribute('aria-label', appSettings.lang === 'on' ? 'Scroll fretboard horizontally' : '指板の横スクロール');
      document.documentElement.lang = appSettings.lang === 'on' ? 'en' : 'ja';
      document.querySelector('#modal-title-settings').textContent = t('settings');
      document.querySelector('#label-lang-setting').textContent = t('langLabel');
      document.querySelector('#lang-off-btn').textContent = appSettings.lang === 'on' ? 'OFF (Japanese)' : 'OFF (日本語)';
      document.querySelector('#lang-on-btn').textContent = appSettings.lang === 'on' ? 'ON (English)' : 'ON (English)';

      document.querySelector('#label-speed-setting').textContent = t('speedLabel');
      document.querySelector('#speed-slow-btn').textContent = t('speedSlow');
      document.querySelector('#speed-fast-btn').textContent = t('speedFast');
      document.querySelector('#label-sound-setting').textContent = t('soundLabel');
      document.querySelector('#sound-exists-btn').textContent = t('soundExists');
      document.querySelector('#sound-none-btn').textContent = t('soundNone');
      
      document.querySelector('#label-q-type').textContent = t('qType');
      questionTypeSelect.options[0].textContent = t('optChord');
      questionTypeSelect.options[1].textContent = t('optScale');
      questionTypeSelect.options[2].textContent = t('optMelody');

      document.querySelector('#label-note-count').textContent = t('noteCount');
      noteCountSelect.options[0].textContent = t('opt2');
      noteCountSelect.options[1].textContent = t('opt3');
      noteCountSelect.options[2].textContent = t('opt4');

      document.querySelector('#label-first-note').textContent = t('firstNote');
      document.querySelector('#first-note-root-btn').textContent = t('optRoot');
      document.querySelector('#first-note-random-btn').textContent = t('optRandom');

      updateStartButton();
      if (game.phase === 'result') {
        replayButton.textContent = t('viewResultBtn');
      } else {
        replayButton.textContent = t('replayBtn');
      }
      playChordBtn.textContent = t('playChordBtn');

      if (game.phase === 'idle') {
        setStatus(null, t('initialMsg'));
      }

      if (questionTypeSelect.value !== 'scale') {
        targetLabel.textContent = t('chordTitleLabel');
      } else {
        targetLabel.textContent = t('scaleTitleLabel');
      }

      updateDeckCounterDisplay();
    }

    document.querySelectorAll('[data-melody-jazz]').forEach(button => {
      button.addEventListener('click', () => {
        appSettings.melodyJazz = button.dataset.melodyJazz;
        updateSettingsUI();
      });
    });

    function updateSettingsUI() {
      const english = appSettings.lang === 'on';
      document.querySelector('#label-melody-jazz').textContent = english ? 'Jazz Mode' : 'ジャズ・モード';
      document.querySelectorAll('[data-melody-jazz]').forEach(button => {
        button.textContent = button.dataset.melodyJazz === 'on' ? 'ON' : 'OFF';
        const selected = button.dataset.melodyJazz === appSettings.melodyJazz;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      firstNoteControls.querySelectorAll('[data-first-note]').forEach(button => {
        const selected = button.dataset.firstNote === appSettings.firstNote;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      if (appSettings.lang === 'on') {
        langOnBtn.classList.add('active');
        langOffBtn.classList.remove('active');
      } else {
        langOffBtn.classList.add('active');
        langOnBtn.classList.remove('active');
      }

      if (appSettings.speed === 'slow') {
        speedSlowBtn.classList.add('active');
        speedFastBtn.classList.remove('active');
      } else {
        speedFastBtn.classList.add('active');
        speedSlowBtn.classList.remove('active');
      }

      if (appSettings.sound === 'exists') {
        soundExistsBtn.classList.add('active');
        soundNoneBtn.classList.remove('active');
      } else {
        soundNoneBtn.classList.add('active');
        soundExistsBtn.classList.remove('active');
      }
    }

    // 設定ボタンクリックでポップアップの表示・非表示を切り替え
    openSettingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      updateSettingsUI();
      settingsPopup.classList.toggle('active');
    });

    // ポップアップ以外をクリックした時に閉じる
    document.addEventListener('click', (e) => {
      if (!settingsPopup.contains(e.target) && e.target !== openSettingsBtn) {
        settingsPopup.classList.remove('active');
      }
    });

    langOffBtn.addEventListener('click', () => {
      appSettings.lang = 'off';
      updateSettingsUI();
      updateStaticTexts();
    });

    langOnBtn.addEventListener('click', () => {
      appSettings.lang = 'on';
      updateSettingsUI();
      updateStaticTexts();
    });

    speedSlowBtn.addEventListener('click', () => {
      appSettings.speed = 'slow';
      updateSettingsUI();
    });

    speedFastBtn.addEventListener('click', () => {
      appSettings.speed = 'fast';
      updateSettingsUI();
    });

    soundExistsBtn.addEventListener('click', () => {
      appSettings.sound = 'exists';
      updateSettingsUI();
    });

    firstNoteControls.querySelectorAll('[data-first-note]').forEach(button => {
      button.addEventListener('click', () => {
        appSettings.firstNote = button.dataset.firstNote;
        updateSettingsUI();
      });

      if (ctx.state !== 'running') throw new Error('Audio context could not start.');
    }

    function recoverPlayback(error) {
      console.error('Playback failed:', error);
      clearTimeout(judgmentTimer);
      endGesture();
      activeVoices.forEach(stop => stop());
      clearBoardMarks();
      game.phase = 'idle';
      game.answers = [];
      updateStartButton();
      startButton.disabled = false;
      replayButton.disabled = true;
      replayButton.textContent = t('replayBtn');
      instrumentSelect.disabled = questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = false;
      statusBox.classList.remove('status-correct', 'status-wrong');
      statusMessage.textContent = appSettings.lang === 'on'
        ? 'Audio could not play. Please press Start Game again.'
        : '音声を再生できませんでした。「問題を出す」を押して再試行してください。';
    }

    async function runPlayback(action) {
      try {
        await action();
      } catch (error) {
        recoverPlayback(error);
      }
    }

    // Clean single-coil-inspired synthesis: a picked transient and three harmonic
    // bands with independent decay. No distortion, detuning, or sample download.
    let cleanGuitarWaves;
    let cleanPickBuffer;
    function prepareCleanGuitar(ctx) {
      if (cleanGuitarWaves) return;
      cleanGuitarWaves = [[1, 4], [5, 12], [13, 32]].map(([first, last]) => {
        const real = new Float32Array(33), imag = new Float32Array(33);
        for (let harmonic = first; harmonic <= last; harmonic++) {
          // Pluck/pickup comb response keeps the bright bridge character without a bell octave.
          const pluck = Math.sin(Math.PI * harmonic * .19) / Math.sin(Math.PI * .19);
          const pickup = .68 + .32 * Math.cos(Math.PI * harmonic * .075);
          imag[harmonic] = pluck * pickup / Math.pow(harmonic, 1.08);
        }
        return ctx.createPeriodicWave(real, imag, { disableNormalization: true });
      });
      cleanPickBuffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * .018), ctx.sampleRate);
      const data = cleanPickBuffer.getChannelData(0);
      let seed = 271828;
      for (let i = 0; i < data.length; i++) {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        data[i] = (seed / 2147483648 - 1) * Math.exp(-i / (ctx.sampleRate * .003));
      }
    }

    function playCleanGuitar(midi, sustain = .56, volume = .35, scheduledTime) {
      if (document.hidden) return () => {};
      const ctx = ensureAudio();
      prepareCleanGuitar(ctx);
      const now = Math.max(scheduledTime ?? ctx.currentTime, ctx.currentTime);
      const frequency = 440 * 2 ** ((midi - 69) / 12);
      const duration = sustain === null ? 5.5 : Math.max(.08, sustain);
      const release = ctx.createGain();
      const highpass = ctx.createBiquadFilter();
      const lowpass = ctx.createBiquadFilter();
      highpass.type = 'highpass'; highpass.frequency.value = 58; highpass.Q.value = .55;
      lowpass.type = 'lowpass'; lowpass.Q.value = .65;
      lowpass.frequency.setValueAtTime(Math.min(8500, frequency * 24 + 2800), now);
      lowpass.frequency.exponentialRampToValueAtTime(Math.min(5200, frequency * 10 + 1600), now + .22);
      highpass.connect(lowpass).connect(release).connect(ctx.destination);
      release.gain.setValueAtTime(volume * .21, ctx.currentTime);
      release.gain.setValueAtTime(volume * .21, now + Math.max(.004, duration - .065));
      release.gain.linearRampToValueAtTime(0, now + duration);
      const sources = [], gains = [];
      let remaining = 4, stopped = false;
      const ended = () => {
        if (--remaining !== 0) return;
        sources.forEach(source => source.disconnect());
        gains.forEach(gain => gain.disconnect());
        highpass.disconnect(); lowpass.disconnect(); release.disconnect();
        activeVoices.delete(stop); queueAudioIdle();
      };
      const stop = () => {
        if (stopped || remaining === 0) return;
        stopped = true;
        const at = ctx.currentTime;
        // Preserve a scheduled release (including future notes) without a gain jump.
        const gateStart = now + Math.max(.004, duration - .065);
        const gateLevel = volume * .21 * (at <= gateStart ? 1 : Math.max(0, (now + duration - at) / .065));
        release.gain.cancelScheduledValues(at);
        release.gain.setValueAtTime(gateLevel, at);
        release.gain.linearRampToValueAtTime(0, at + .055);
        sources.forEach(source => { try { source.stop(at + .065); } catch (_) {} });
      };
      activeVoices.add(stop);
      cleanGuitarWaves.forEach((wave, index) => {
        const osc = ctx.createOscillator(), envelope = ctx.createGain();
        osc.setPeriodicWave(wave); osc.frequency.setValueAtTime(frequency, now);
        const decay = [1.55, .34, .075][index];
        envelope.gain.setValueAtTime(0, now);
        envelope.gain.linearRampToValueAtTime(1, now + .0025);
        const decayEnd = Math.min(5.5, decay * Math.log(100000));
        envelope.gain.exponentialRampToValueAtTime(Math.exp(-decayEnd / decay), now + decayEnd);
        osc.connect(envelope).connect(highpass);
        osc.onended = ended;
        sources.push(osc); gains.push(envelope);
        osc.start(now); osc.stop(now + duration + .02);
      });
      const pick = ctx.createBufferSource(), pickGain = ctx.createGain();
      pick.buffer = cleanPickBuffer; pickGain.gain.value = .09;
      pick.connect(pickGain).connect(highpass); pick.onended = ended;
      sources.push(pick); gains.push(pickGain);
      pick.start(now); pick.stop(now + .019);
      return stop;
    }

    // A sustained, warm body plus a short bell-like attack; no reverb or audio loop.
    const instrumentWaves = new Map();
    function playBassPiano(midi, sustain, volume, scheduledTime, tone) {
      if (document.hidden) return () => {};
      const ctx = ensureAudio(), now = Math.max(scheduledTime ?? ctx.currentTime, ctx.currentTime);
      const piano = tone === 'piano';
      const bassLowLift = piano ? 0 : Math.max(0, Math.min(1, (60 - midi) / 20));
      const waveKey = piano ? tone : tone + ':' + Math.max(40, Math.min(60, midi));
      if (!instrumentWaves.has(waveKey)) {
        const bands = piano ? [[1,.73,.42,.285],[0,0,0,0,.20,.165,.10,.075],[0,0,0,0,0,0,0,0,.055,.040,.030,.020]]
          : [[1,.50,.31,.16],[0,0,0,0,.12,.075,.045],[0,0,0,0,0,0,0,.030,.018]];
        // Add a little second/third harmonic presence only in the lower register.
        if (!piano) bands.forEach(partials => partials.forEach((value,index) => {
          if (index >= 1) partials[index] = value * (1 + (index <= 2 ? .10 : .05) * bassLowLift);
        }));
        instrumentWaves.set(waveKey, bands.map(partials => ctx.createPeriodicWave(new Float32Array(partials.length + 1), new Float32Array([0,...partials]), { disableNormalization:true })));
      }
      const duration = sustain === null ? 6 : Math.max(.08, sustain);
      const frequency = 440 * 2 ** ((midi - 69) / 12);
      const highpass = ctx.createBiquadFilter(), lowpass = ctx.createBiquadFilter(), release = ctx.createGain();
      // Brighter hammer-like attack and decaying upper harmonics; low cut keeps chords clear.
      // Lower gain compensates for the richer spectrum and preserves chord headroom.
      highpass.type = 'highpass'; highpass.frequency.value = piano ? 125 : 38; highpass.Q.value = .55;
      lowpass.type = 'lowpass'; lowpass.Q.value = piano ? .6 : .7;
      lowpass.frequency.setValueAtTime(piano ? 10000 : 6000, now);
      lowpass.frequency.exponentialRampToValueAtTime(piano ? 5500 : 1100, now + (piano ? .3 : .22));
      highpass.connect(lowpass).connect(release).connect(ctx.destination);
      // Gentle low-register lift; taper to the normal level by C4.
      const level = volume * (piano ? .20 : .32 * (1 + .30 * bassLowLift));
      const releaseStart = now + duration - .065;
      release.gain.setValueAtTime(level, ctx.currentTime);
      release.gain.setValueAtTime(level, releaseStart);
      release.gain.linearRampToValueAtTime(0, now + duration);
      const sources = [];
      let remaining = 3, stopped = false;
      const stop = () => {
        if (stopped || remaining === 0) return;
        stopped = true;
        const at = ctx.currentTime;
        const current = level * (at <= releaseStart ? 1 : Math.max(0,(now + duration - at)/.065));
        release.gain.cancelScheduledValues(at); release.gain.setValueAtTime(current, at);
        release.gain.linearRampToValueAtTime(0, at + .055);
        sources.forEach(source => { try { source.stop(at + .065); } catch (_) {} });
      };
      activeVoices.add(stop);
      instrumentWaves.get(waveKey).forEach((wave,index) => {
        const source = ctx.createOscillator(), envelope = ctx.createGain();
        source.setPeriodicWave(wave); source.frequency.setValueAtTime(frequency, now);
        const decay = (piano ? [1.45,.50,.14] : [1.30,.38,.10])[index];
        const end = Math.min(6, decay * Math.log(100000));
        envelope.gain.setValueAtTime(0, now);
        envelope.gain.linearRampToValueAtTime(1, now + (piano ? .003 : .004));
        envelope.gain.exponentialRampToValueAtTime(Math.exp(-end/decay), now + end);
        source.connect(envelope).connect(highpass);
        source.onended = () => {
          source.disconnect(); envelope.disconnect();
          if (--remaining === 0) {
            highpass.disconnect(); lowpass.disconnect(); release.disconnect();
            activeVoices.delete(stop); queueAudioIdle();
          }
        };
        sources.push(source);
        source.start(now); source.stop(now + duration + .02);
      });
      return stop;
    }

    function play(midi, sustain = .56, volume = .35, scheduledTime, role = 'fretboard') {
      if (instrumentMode === 'bass') return playBassPiano(midi, sustain, volume, scheduledTime, role === 'chord' ? 'piano' : 'bass');
      if (instrumentMode === 'guitar') return playCleanGuitar(midi, sustain, volume, scheduledTime);
      if (document.hidden) return () => {};
      const ctx = ensureAudio();
      const now = scheduledTime ?? ctx.currentTime;
      const frequency = 440 * 2 ** ((midi - 69) / 12);
      const duration = sustain === null ? null : Math.max(.08, sustain);
      const level = volume * .46;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const tine = ctx.createOscillator();
      const tineGain = ctx.createGain();
      // Keep note envelopes intact; a separate gain controls the release of both layers.
      const releaseGain = ctx.createGain();
      releaseGain.gain.setValueAtTime(1, ctx.currentTime);
      releaseGain.connect(ctx.destination);
      osc.setPeriodicWave(trainingWave);
      osc.frequency.setValueAtTime(frequency, now);
      tine.type = 'sine';
      tine.frequency.setValueAtTime(frequency * 4, now);
      const decayTime = duration === null ? .18 : Math.min(.18, duration * .5);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(level, now + .005);
      gain.gain.linearRampToValueAtTime(level * .78, now + decayTime);
      const tineDuration = duration === null ? .24 : Math.min(.24, duration);
      tineGain.gain.setValueAtTime(0, now);
      tineGain.gain.linearRampToValueAtTime(level * .24, now + .003);
      tineGain.gain.exponentialRampToValueAtTime(.0001, now + tineDuration);
      osc.connect(gain).connect(releaseGain);
      tine.connect(tineGain).connect(releaseGain);
      let stopped = false;
      let tineEnded = false;
      let bodyEnded = false;
      const disconnectRelease = () => {
        if (bodyEnded && tineEnded) releaseGain.disconnect();
      };
      const stop = () => {
        if (stopped) return;
        stopped = true;
        const at = ctx.currentTime;
        // Cancelling an in-progress attack/decay ramp can abruptly change its value.
        // Fade a previously constant gain instead, reaching exact silence before stop().
        releaseGain.gain.setValueAtTime(1, at);
        releaseGain.gain.linearRampToValueAtTime(0, at + .07);
        osc.stop(at + .085);
        if (!tineEnded) tine.stop(at + .085);
      };
      activeVoices.add(stop);
      osc.onended = () => {
        stopped = true;
        bodyEnded = true;
        activeVoices.delete(stop);queueAudioIdle();
        osc.disconnect();
        gain.disconnect();
        disconnectRelease();
      };
      tine.onended = () => {
        tineEnded = true;
        tine.disconnect();
        tineGain.disconnect();
        disconnectRelease();
      };
      // Always schedule start before stop (required by Web Audio).
      osc.start(now);
      tine.start(now);
      tine.stop(now + tineDuration + .01);
      if (duration !== null) {
        const end = now + duration;
        gain.gain.setValueAtTime(level * .78, Math.max(now + decayTime, end - .06));
        gain.gain.linearRampToValueAtTime(0, end);
        osc.stop(end + .02);
      }
      return stop;
    }

    function playChord(midiNotes) {
      if (!midiNotes || midiNotes.length === 0) return;
      const sortedMidis = [...midiNotes].sort((a, b) => a - b);
      const voiceScale = instrumentMode !== 'original' ? Math.min(1, 3 / sortedMidis.length) : 1;
      const speedFactor = appSettings.speed === 'fast' ? 0.5 : 1.0;
      
      const startTime = ensureAudio().currentTime;
      const endTime = startTime + 1.2 * speedFactor;
      sortedMidis.forEach((midi, idx) => {
        const isRoot = (midi % 12 === game.rootPitchIndex);
        const noteStartTime = startTime + (isRoot ? 0 : idx * .045 * speedFactor);
        // Every voice shares the same final 60 ms release and silence time.
        play(midi, endTime - noteStartTime, (isRoot ? .4 : .25) * voiceScale, noteStartTime, 'chord');
      });
    }

    async function playChordArpeggio() {
      if (!['guess', 'result'].includes(game.phase) || game.mode === 'scale') return;
      if (!game.chordMidiNotes || game.chordMidiNotes.length === 0) return;
      playChordBtn.disabled = true;
      startButton.disabled = replayButton.disabled = true;
      instrumentSelect.disabled = questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = true;
      await unlockAudio();

      const sortedMidis = [...game.chordMidiNotes].sort((a, b) => a - b);
      const voiceScale = instrumentMode !== 'original' ? Math.min(1, 3 / sortedMidis.length) : 1;
      const speedFactor = appSettings.speed === 'fast' ? 0.5 : 1.0;

      const intervalMs = 280 * speedFactor;
      const sustainTime = 1.0 * speedFactor;
      const startTime = audioContext.currentTime;

      const endTime = startTime + (sortedMidis.length - 1) * intervalMs / 1000 + sustainTime;
      sortedMidis.forEach((midi, index) => {
        const noteStartTime = startTime + (index * intervalMs / 1000);
        // Keep the staggered attacks, then release all chord tones together.
        play(midi, endTime - noteStartTime, 0.28 * voiceScale, noteStartTime, 'chord');
      });

      const totalWaitMs = (sortedMidis.length - 1) * intervalMs + (sustainTime * 1000);
      await wait(totalWaitMs);

      playChordBtn.disabled = false;
      startButton.disabled = replayButton.disabled = false;
      instrumentSelect.disabled = questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = false;
    }

    playChordBtn.addEventListener('click', () => runPlayback(playChordArpeggio));

    let lastPlayingCell = null;
    let playingTimeoutId = null;

    function preview(cell, string, fret, showStatus = true, sustain = 0.56, showVisual = true, isCorrectStyle = false, isWrongStyle = false) {
      const midi = string.midi + fret;
      const note = noteName(midi);
      if (showStatus) setStatus(null, `${string.name} String / ${fret} Fret — ${note}`);
      const speedFactor = appSettings.speed === 'fast' ? 0.5 : 1.0;
      play(midi, sustain * speedFactor, .35, undefined, 'question');
      if (!showVisual) return;
      
      if (playingTimeoutId) {
        clearTimeout(playingTimeoutId);
        playingTimeoutId = null;
      }
      if (lastPlayingCell) {
        lastPlayingCell.classList.remove('playing', 'playing-correct', 'playing-wrong');
      }

      let activeClass = 'playing';
      if (isCorrectStyle) activeClass = 'playing-correct';
      if (isWrongStyle) activeClass = 'playing-wrong';

      cell.classList.remove('playing', 'playing-correct', 'playing-wrong');
      void cell.getBoundingClientRect();
      cell.classList.add(activeClass);

      lastPlayingCell = cell;
      playingTimeoutId = setTimeout(() => {
        cell.classList.remove(activeClass);
        if (lastPlayingCell === cell) {
          lastPlayingCell = null;
        }
        playingTimeoutId = null;
      }, getAdjustedTime(450));
    }

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    
    function clearBoardMarks() {
      playChordBtn.disabled = true;
      positions.forEach(position => position.cell.classList.remove('selected', 'correct', 'wrong', 'playing', 'playing-correct', 'playing-wrong', 'computer-first'));
      if (rootMarkerGroup) {
        rootMarkerGroup.innerHTML = '';
      }
    }

    function highlightRootNotes(rootPitchIndex) {
      if (!rootMarkerGroup) return;
      rootMarkerGroup.innerHTML = '';
      
      positions.forEach(pos => {
        if (pos.midi % 12 === rootPitchIndex) {
          const circle = node('circle', {
            cx: pos.cx,
            cy: pos.cy,
            r: 18,
            class: 'root-marker'
          });
          const rootLabel=node('text',{x:pos.cx,y:pos.cy+5,class:'note root-note'});
          rootLabel.textContent=noteName(pos.midi);
          rootMarkerGroup.append(circle,rootLabel);
        }
      });
    }

    function isOctaveInterval(posA, posB) {
      const diff = Math.abs(posA.midi - posB.midi);
      return diff > 0 && diff % 12 === 0;
    }

    function hasConsecutiveOctave(seq) {
      for (let i = 0; i < seq.length - 1; i++) {
        if (isOctaveInterval(seq[i], seq[i + 1])) return true;
      }
      return false;
    }

    const guitarFormCache = new Map();
    function guitarFingerCount(form) {
      const pressed = form.filter(note => note.fret > 0);
      if (!pressed.length) return 0;
      const singles = pressed.map((_, index) => 1 << index), barres = [];
      // A barre can span higher-fretted or muted strings, but never an open or
      // lower-fretted sounding string. Count the smallest set of up to four fingers.
      pressed.forEach((left, i) => pressed.forEach((right, j) => {
        if (j <= i || left.fret !== right.fret) return;
        const lo = Math.min(left.stringIndex, right.stringIndex);
        const hi = Math.max(left.stringIndex, right.stringIndex);
        if (form.some(note => note.stringIndex >= lo && note.stringIndex <= hi && note.fret < left.fret)) return;
        barres.push(pressed.reduce((mask, note, k) => mask | (note.fret === left.fret && note.stringIndex >= lo && note.stringIndex <= hi ? 1 << k : 0), 0));
      }));
      const complete = (1 << pressed.length) - 1;
      const fingers = [Array(complete + 1).fill(7), Array(complete + 1).fill(7)];
      fingers[0][0] = 0;
      // Keep shapes conservative: at most one barre, with the other fingers separate.
      for (let mask = 0; mask <= complete; mask++) {
        for (let usedBarre = 0; usedBarre <= 1; usedBarre++) {
          for (const cover of singles) fingers[usedBarre][mask | cover] = Math.min(fingers[usedBarre][mask | cover], fingers[usedBarre][mask] + 1);
        }
        for (const cover of barres) fingers[1][mask | cover] = Math.min(fingers[1][mask | cover], fingers[0][mask] + 1);
      }
      return Math.min(fingers[0][complete], fingers[1][complete]);
    }

    function guitarChordForms(rootPitchIndex, intervals) {
      const key = `${rootPitchIndex}:${intervals.join(',')}`;
      if (guitarFormCache.has(key)) return guitarFormCache.get(key);
      const tuning = instruments.guitar.tuning;
      const pitchClasses = [...new Set(intervals.map(interval => (rootPitchIndex + interval) % 12))];
      const forms = [], seen = new Set();
      // Four adjacent fret positions, with open strings only in the first position.
      for (let anchor = 1; anchor <= frets - 3; anchor++) {
        const choices = tuning.map((openMidi, stringIndex) => {
          const notes = [];
          for (let fret = anchor === 1 ? 0 : anchor; fret <= anchor + 3; fret++) {
            if (pitchClasses.includes((openMidi + fret) % 12)) notes.push({ stringIndex, fret, midi:openMidi + fret });
          }
          return notes;
        });
        const candidates = [];
        function search(stringIndex, form, mask) {
          if (stringIndex === tuning.length) {
            if (form.length < Math.max(4, pitchClasses.length) || mask !== (1 << pitchClasses.length) - 1) return;
            const lowest = Math.min(...form.map(note => note.midi));
            if (lowest % 12 !== rootPitchIndex) return;
            // Keep extensions above the bass root instead of collapsing a ninth to a second.
            if (intervals.some(interval => interval >= 12 && !form.some(note => note.midi % 12 === (rootPitchIndex + interval) % 12 && note.midi >= lowest + interval))) return;
            const fingerCount = guitarFingerCount(form);
            if (fingerCount > 4) return;
            const signature = form.map(note => `${note.stringIndex}:${note.fret}`).join(',');
            if (seen.has(signature)) return;
            seen.add(signature);
            const fretted = form.filter(note => note.fret > 0).map(note => note.fret);
            const span = fretted.length ? Math.max(...fretted) - Math.min(...fretted) : 0;
            const gaps = Math.max(...form.map(note => note.stringIndex)) - Math.min(...form.map(note => note.stringIndex)) + 1 - form.length;
            candidates.push({ notes:form.slice(), score:Math.max(...form.map(note => note.fret)) * 5 + fingerCount * 2 + span + gaps * 3 - form.length });
            return;
          }
          if (form.length + tuning.length - stringIndex < Math.max(4, pitchClasses.length)) return;
          for (const note of choices[stringIndex]) {
            form.push(note);
            search(stringIndex + 1, form, mask | (1 << pitchClasses.indexOf(note.midi % 12)));
            form.pop();
          }
          search(stringIndex + 1, form, mask);
        }
        search(0, [], 0);
        candidates.sort((a, b) => a.score - b.score);
        forms.push(...candidates.slice(0, 16));
      }
      forms.sort((a, b) => a.score - b.score);
      const result = forms.map(form => form.notes);
      guitarFormCache.set(key, result);
      return result;
    }

    function guitarFormPositions(form) {
      return form.map(note => positions.find(pos => pos.string.number === note.stringIndex + 1 && pos.fret === note.fret));
    }

    // Accepted-question coverage is tracked per instrument/chord; shuffled bags
    // rotate the requested feature without favoring one overlapping chord type.
    const chordFeatureCoverage = new Map();
    function chordFeatureState(def, count) {
      const extensions = def.intervals.filter(interval => interval >= 12);
      const sevenths = def.intervals.filter(interval => interval === 10 || interval === 11);
      const intervals = [...extensions, ...sevenths];
      if (sevenths.length && !extensions.length) intervals.push(...def.intervals.filter(i => i === 3 || i === 4));
      if (def.intervals.includes(9)) intervals.push(9);
      if (def.name.includes('♭5') || def.name.includes('dim')) intervals.push(6);
      if (def.name.includes('sus')) intervals.push(...def.intervals.filter(i => i === 2 || i === 5));
      const pitchClasses = [...new Set(intervals.map(interval => interval % 12))];
      if (!pitchClasses.length) return null;
      const tensionSeventh = extensions.length > 0 && sevenths.length > 0;
      const key = instrumentMode + ':' + def.name + (tensionSeventh ? ':' + count : '');
      if (!chordFeatureCoverage.has(key)) chordFeatureCoverage.set(key, { total:0, hits:0, bag:[] });
      const stats = chordFeatureCoverage.get(key);
      if (!stats.bag.length) {
        const tickets = tensionSeventh
          ? (count === 2
            ? [...Array.from({length:7}, (_,i) => extensions[i % extensions.length] % 12), ...Array(3).fill(sevenths[0] % 12)]
            : extensions.map(interval => interval % 12))
          : pitchClasses;
        stats.bag = shuffleMelodies(tickets);
      }
      return { stats, pitchClasses, selected:stats.bag.at(-1), tensionSeventh, count,
        extensionClasses:extensions.map(interval => interval % 12),
        seventhClasses:sevenths.map(interval => interval % 12) };
    }
    function hasChordFeature(sequence, root, feature) {
      return sequence.some(note => feature.pitchClasses.includes((note.midi - root + 120) % 12));
    }
    function acceptsChordFeature(sequence, root, feature) {
      if (feature?.tensionSeventh) {
        const classes = sequence.map(note => (note.midi - root + 120) % 12);
        if (feature.count !== 2) return classes.some(pc => feature.extensionClasses.includes(pc));
        // Two-note questions have exclusive 7:3 feature groups, shuffled per chord/instrument.
        const excluded = feature.seventhClasses.includes(feature.selected)
          ? feature.extensionClasses : feature.seventhClasses;
        return classes.includes(feature.selected) && !classes.some(pc => excluded.includes(pc));
      }
      return !feature || feature.stats.hits >= Math.ceil((feature.stats.total + 1) * .6)
        || sequence.some(note => (note.midi - root + 120) % 12 === feature.selected);
    }
    function recordChordFeature(sequence, root, feature) {
      if (!feature) return;
      feature.stats.total++;
      if (hasChordFeature(sequence, root, feature)) feature.stats.hits++;
      if (sequence.some(note => (note.midi - root + 120) % 12 === feature.selected)) feature.stats.bag.pop();
    }

    function makeGuitarChordQuestion(count, isRootFirst) {
      if (!difficulty().hard) chordTypeBag = [];
      else if (!chordTypeBag.length) chordTypeBag = shuffleMelodies(['basic','basic','basic','basic','basic','tension','tension','tension','tension','tension']);
      const useTension = difficulty().hard && chordTypeBag.at(-1) === 'tension';
      const defs = difficulty().hard ? (useTension ? tensionChordDefinitions : basicChordDefinitions)
        : basicChordDefinitions.filter(def => def.name === '' || def.name === 'm');
      const choices = shuffleMelodies(defs.flatMap(def => Array.from({ length:12 }, (_, rootPitchIndex) => ({ def, rootPitchIndex }))));
      for (const { def, rootPitchIndex } of choices) {
        const titleName = pitchNames[rootPitchIndex] + def.name;
        const feature = chordFeatureState(def, count);
        if (titleName === lastChordName) continue;
        const forms = guitarChordForms(rootPitchIndex, def.intervals);
        // Start with comfortable lower-position forms, retaining higher forms as a fallback.
        const orderedForms = [...shuffleMelodies(forms.slice(0, 24)), ...shuffleMelodies(forms.slice(24))];
        for (const form of orderedForms) {
          const notes = guitarFormPositions(form);
          let sequence = null;
          function extend(selected) {
            if (selected.length === count) {
              if (chordShape(selected) === lastChordShape) return false;
              if (!acceptsChordFeature(selected, rootPitchIndex, feature)) return false;
              sequence = selected.slice(); return true;
            }
            for (const note of shuffleMelodies(notes)) {
              if (selected.some(other => other.string === note.string || other.midi === note.midi)) continue;
              if (!selected.length && (note.midi % 12 === rootPitchIndex) !== isRootFirst) continue;
              if (selected.length && isOctaveInterval(selected.at(-1), note)) continue;
              const midis = [...selected.map(other => other.midi), note.midi];
              if (Math.max(...midis) - Math.min(...midis) > (def.isTension ? 24 : 12)) continue;
              selected.push(note);
              if (extend(selected)) return true;
              selected.pop();
            }
            return false;
          }
          if (!extend([])) continue;
          recordChordFeature(sequence, rootPitchIndex, feature);
          lastChordName = titleName; lastChordShape = chordShape(sequence);
          if (difficulty().hard) chordTypeBag.pop();
          return { sequence, titleName, displayKey:titleName, rootPitchIndex,
            chordMidiNotes:form.map(note => note.midi), guitarChordForm:form };
        }
      }
      throw new Error('No playable guitar chord form satisfying the question rules');
    }

    function chordPlaybackNotes(rootPitchIndex, intervals, preferredRoot) {
      if (instrumentMode === 'guitar') {
        const form = guitarChordForms(rootPitchIndex, intervals)[0];
        if (!form) throw new Error('No playable guitar chord form');
        return form.map(note => note.midi);
      }
      // Keep extensions in their compound octave: folding a 13th down next to
      // the seventh creates an unwanted semitone. Current definitions all fit
      // within two octaves and contain no adjacent semitones in this voicing.
      const root = instrumentMode === 'original'
        ? 57 + (rootPitchIndex - 9 + 12) % 12 // A3 through G#4
        : 48 + rootPitchIndex; // Piano: C3 through B3
      const notes = intervals.map(interval => root + interval).sort((a,b) => a-b);
      const highestFretboardMidi = instrument().tuning[0] + 15;
      // Shift the entire voicing together, preserving all chord intervals.
      return notes.at(-1) > highestFretboardMidi ? notes.map(midi => midi - 12) : notes;
    }

    let chordTypeBag = [];
    let lastChordName = null;
    let lastChordShape = null;
    function chordShape(sequence) {
      return sequence.map(p => p.midi - sequence[0].midi).join(',');
    }
    function makeChordQuestion(count, isRootFirst) {
      if (instrumentMode === 'guitar') return makeGuitarChordQuestion(count, isRootFirst);
      let attempts = 0;
      if (!difficulty().hard) chordTypeBag = [];
      else if (!chordTypeBag.length) {
        chordTypeBag = shuffleMelodies(['basic','basic','basic','basic','basic',
          'tension','tension','tension','tension','tension']);
      }
      const useTension = difficulty().hard && chordTypeBag.at(-1) === 'tension';
      const availableDefs = difficulty().hard
        ? (useTension ? tensionChordDefinitions : basicChordDefinitions)
        : basicChordDefinitions.filter(def => def.name === '' || def.name === 'm');

      const firstCandidates = positions.filter(pos => pos.fret >= 1 && pos.fret <= 10);

      while (attempts < 2500) {
        attempts++;
        const rootPitchIndex = Math.floor(Math.random() * 12);
        const rootName = pitchNames[rootPitchIndex];
        const chordDef = availableDefs[Math.floor(Math.random() * availableDefs.length)];
        const chordName = rootName + chordDef.name;
        const feature = chordFeatureState(chordDef, count);
        if (chordName === lastChordName) continue;

        if (firstCandidates.length === 0) break;
        const first = firstCandidates[Math.floor(Math.random() * firstCandidates.length)];
        const firstPitchClass = first.midi % 12;

        if (isRootFirst) {
          if (firstPitchClass !== rootPitchIndex) continue;
        } else {
          const nonRootIntervals = chordDef.intervals.filter(i => i % 12 !== 0);
          const nonRootPitchClasses = nonRootIntervals.map(i => (rootPitchIndex + i) % 12);
          if (!nonRootPitchClasses.includes(firstPitchClass)) continue;
        }

        const targetPitchClasses = chordDef.intervals.map(i => (rootPitchIndex + i) % 12);

        const candidates = positions.filter(pos => {
          if (pos === first) return false;
          if (Math.abs(pos.fret - first.fret) > 4) return false;
          if (!targetPitchClasses.includes(pos.midi % 12)) return false;
          
          if (pos.midi % 12 === firstPitchClass) {
            return Math.random() < 0.15;
          }
          return true;
        });

        if (candidates.length < count - 1) continue;

        const shuffled = [...candidates];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        let validSeq = null;

        const maxRangeMidi = chordDef.isTension ? 24 : 12;

        const isValidSequence = (seq) => {
          const minF = Math.min(...seq.map(p => p.fret));
          const maxF = Math.max(...seq.map(p => p.fret));
          if (maxF - minF > 4) return false;

          const minMidi = Math.min(...seq.map(p => p.midi));
          const maxMidi = Math.max(...seq.map(p => p.midi));
          if (maxMidi - minMidi > maxRangeMidi) return false;

          if (hasConsecutiveOctave(seq)) return false;
          if (chordShape(seq) === lastChordShape) return false;
          if (!acceptsChordFeature(seq, rootPitchIndex, feature)) return false;

          return true;
        };

        if (count === 2) {
          const seq = [first, shuffled[0]];
          if (isValidSequence(seq)) { validSeq = seq; }
        } else if (count === 3) {
          for (let i = 0; i < shuffled.length; i++) {
            for (let j = i + 1; j < shuffled.length; j++) {
              const seq = [first, shuffled[i], shuffled[j]];
              if (isValidSequence(seq)) { validSeq = seq; break; }
            }
            if (validSeq) break;
          }
        } else if (count === 4) {
          for (let i = 0; i < shuffled.length; i++) {
            for (let j = i + 1; j < shuffled.length; j++) {
              for (let k = j + 1; k < shuffled.length; k++) {
                const seq = [first, shuffled[i], shuffled[j], shuffled[k]];
                if (isValidSequence(seq)) { validSeq = seq; break; }
              }
              if (validSeq) break;
            }
            if (validSeq) break;
          }
        }

        if (validSeq && validSeq.length === count) {
          const baseMidi = instrument().chordRoot + rootPitchIndex;
          const chordMidiNotes = chordPlaybackNotes(rootPitchIndex, chordDef.intervals, baseMidi);
          recordChordFeature(validSeq, rootPitchIndex, feature);
          lastChordName = chordName;
          lastChordShape = chordShape(validSeq);
          if (difficulty().hard) chordTypeBag.pop();
          return { sequence: validSeq, titleName: chordName, displayKey: chordName, rootPitchIndex, chordMidiNotes };
        }
      }

      throw new Error('No chord question satisfying the range and repetition rules');
    }

    function makeScaleQuestion() {
      let outerAttempts = 0;

      while (outerAttempts < 50) {
        outerAttempts++;

        if (scaleDeck.length === 0) {
          resetScaleDeck();
        }

        // Preserve unseen advanced patterns while EASY repeats the seven modes.
        const eligibleIndex = scaleDeck.findIndex(item => difficulty().hard
          || jazzScaleDefinitions.indexOf(item.scaleDef) < 7);
        const item = eligibleIndex >= 0 ? scaleDeck.splice(eligibleIndex, 1)[0]
          : { scaleDef: jazzScaleDefinitions[Math.floor(Math.random() * 7)], isDescending: Math.random() < .5 };
        updateDeckCounterDisplay();

        const scaleDef = item.scaleDef;
        const isDescending = item.isDescending;

        let innerAttempts = 0;
        while (innerAttempts < 100) {
          innerAttempts++;
          const rootPitchIndex = Math.floor(Math.random() * 12);
          const rootName = pitchNames[rootPitchIndex];
          const scaleTitle = `${rootName} ${scaleDef.name}`;
          const displayKey = `${rootName} Key`;

          const firstCandidates = positions.filter(pos => pos.midi % 12 === rootPitchIndex && pos.fret >= 1 && pos.fret <= 8);
          if (firstCandidates.length === 0) continue;
          const anchorRoot = firstCandidates[Math.floor(Math.random() * firstCandidates.length)];

          let ascendingSequence = [anchorRoot];
          let possible = true;

          for (let i = 1; i < scaleDef.intervals.length; i++) {
            const targetMidi = anchorRoot.midi + scaleDef.intervals[i];
            const options = positions.filter(pos => 
              pos.midi === targetMidi && Math.abs(pos.fret - anchorRoot.fret) <= 4
            );

            if (options.length === 0) {
              possible = false;
              break;
            }
            options.sort((a, b) => Math.abs(a.fret - anchorRoot.fret) - Math.abs(b.fret - anchorRoot.fret));
            ascendingSequence.push(options[0]);
          }

          if (possible) {
            const finalSequence = isDescending ? [...ascendingSequence].reverse() : ascendingSequence;

            return {
              sequence: finalSequence,
              titleName: scaleTitle,
              displayKey: displayKey,
              rootPitchIndex,
              chordMidiNotes: []
            };
          }
        }
      }

      throw new Error('No playable scale question');
    }

    function findCloseFretForTarget(targetPos) {
      if (!game.target || game.target.length === 0) return targetPos;

      const candidates = positions.filter(pos => pos.midi === targetPos.midi);
      if (candidates.length === 0) return targetPos;

      const userRootAns = game.answers.find(ans => ans.midi % 12 === game.rootPitchIndex);
      const targetRootPos = game.target.find(pos => pos.midi % 12 === game.rootPitchIndex);
      
      const refRootFret = userRootAns ? userRootAns.fret : (targetRootPos ? targetRootPos.fret : null);
      
      const avgFret = game.target.reduce((sum, pos) => sum + pos.fret, 0) / game.target.length;

      candidates.sort((a, b) => {
        if (refRootFret !== null) {
          const diffA = Math.abs(a.fret - refRootFret);
          const diffB = Math.abs(b.fret - refRootFret);
          if (diffA !== diffB) return diffA - diffB;
        }
        return Math.abs(a.fret - avgFret) - Math.abs(b.fret - avgFret);
      });

      return candidates[0];
    }

    async function playQuestion(includeChord = false, includeScaleKey = false) {
      if (!game.target.length) return;
      playChordBtn.disabled = true;
      startButton.disabled = replayButton.disabled = true;
      instrumentSelect.disabled = questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = true;
      await unlockAudio();
      activeVoices.forEach(stop => stop());
      const previousPhase = game.phase;
      game.phase = 'playing';
      startButton.disabled = true;
      replayButton.disabled = true;
      instrumentSelect.disabled = questionTypeSelect.disabled = true;
      noteCountSelect.disabled = true;
      firstNoteControls.disabled = true;

      const isShowingResult = (previousPhase === 'result');
      const total = game.target.length;
      if (game.mode === 'melody') highlightRootNotes(game.rootPitchIndex);

      const displayTitle = (game.mode !== 'scale' || isShowingResult) ? questionTitle() : game.displayKey;
      targetTitle.textContent = displayTitle;

      positions.forEach(p => p.cell.classList.remove('selected', 'correct', 'wrong', 'playing-correct', 'playing-wrong', 'computer-first'));

      if (!isShowingResult && game.target.length > 0) {
        game.target[0].cell.classList.add('computer-first');
      }

      if (includeChord && (game.mode === 'chord' || game.mode === 'melody') && !isShowingResult) {
        highlightRootNotes(game.rootPitchIndex);
        setStatus(null, t('chordPlaying'));
        playChord(game.chordMidiNotes);
        await wait(getAdjustedTime(1500));
      } else if (game.mode === 'scale' && includeScaleKey && !isShowingResult) {
        highlightRootNotes(game.rootPitchIndex);
        setStatus(null, t('scalePlaying'));
        const firstNoteMidi = game.target[0].midi;
        play(firstNoteMidi, getAdjustedTime(1.05), 0.4, undefined, 'question');
        await wait(getAdjustedTime(1450));
      }

      for (let i = 0; i < total; i++) {
        let activePos = game.target[i];
        let isNoteCorrect = true;

        if (isShowingResult) {
          const userAns = game.answers[i];
          if (userAns && userAns.midi === game.target[i].midi) {
            activePos = userAns;
            isNoteCorrect = true;
          } else {
            activePos = findCloseFretForTarget(game.target[i]);
            isNoteCorrect = false;
          }
        }

        const msg = isShowingResult
          ? t('replayCorrecting', i + 1)
          : (i === 0 
              ? t('firstNoteGuessPrompt') 
              : t('listenCarefully', i + 1, total));

        setStatus(null, msg);
        
        const shouldShowVisual = isShowingResult || (i === 0);
        preview(
          activePos.cell, 
          activePos.string, 
          activePos.fret, 
          false, 
          .56, 
          shouldShowVisual, 
          isShowingResult && isNoteCorrect, 
          isShowingResult && !isNoteCorrect
        );

        if (isShowingResult) {
          activePos.cell.classList.add(isNoteCorrect ? 'correct' : 'wrong');
        }

        await wait(getAdjustedTime(beatMs * 1.3));
      }

      await wait(getAdjustedTime(400));

      if (previousPhase === 'result') {
        game.phase = 'result';
        showResult(false);
      } else {
        game.phase = 'guess';
        const currentAnsLen = game.answers.length;
        const msg = currentAnsLen > 0
          ? t('guessNextPrompt', currentAnsLen + 1, total)
          : t('guessFirstPrompt', total);
        setStatus(null, msg);
      }
      playChordBtn.disabled = game.mode === 'scale';
      startButton.disabled = false;
      updateStartButton();
      replayButton.disabled = false;
      instrumentSelect.disabled = questionTypeSelect.disabled = false;
      noteCountSelect.disabled = false;
      firstNoteControls.disabled = false;
    }

    function showResult(isNewAnswer = true) {
      const correct = game.answers.length === game.target.length && game.answers.every((ans, idx) => ans.midi === game.target[idx].midi);

      if (isNewAnswer) {
        clearTimeout(judgmentTimer);
        judgmentTimer = setTimeout(() => {
          if (!document.hidden) playJudgmentSound(correct);
        }, 500);
      }

      positions.forEach(p => p.cell.classList.remove('selected', 'correct', 'wrong', 'computer-first'));
      game.answers.forEach((ans, idx) => {
        const isNoteCorrect = ans.midi === game.target[idx].midi;
        if (isNoteCorrect) {
          ans.cell.classList.add('correct');
        } else {
          const closeFret = findCloseFretForTarget(game.target[idx]);
          closeFret.cell.classList.add('wrong');
        }
      });

      targetTitle.textContent = questionTitle();
      
      if (isNewAnswer) recordResult(correct);
      setStatus(null, t(correct ? 'correctMsg' : 'wrongMsg'), correct ? 'correct' : 'wrong');

      if (game.mode === 'chord' || game.mode === 'melody') {
        playChordBtn.disabled = false;
      } else {
        playChordBtn.disabled = true;
      }
      
      game.phase = 'result';
      startButton.disabled = false;
      updateStartButton();
      replayButton.textContent = t('viewResultBtn');
      replayButton.disabled = false;
    }

    function choose(position) {
      if (game.phase !== 'guess') {
        return;
      }
      
      const targetLen = game.target.length;
      if (game.answers.length >= targetLen) return;

      game.answers.push(position);
      position.cell.classList.add('selected');

      if (game.answers.length < targetLen) {
        setStatus(null, t('guessNextPrompt', game.answers.length + 1, targetLen));
      } else {
        showResult(true);
      }
    }

    let currentHeldPosition = null;

    function startHeldNote(position) {
      if (playingTimeoutId) {
        clearTimeout(playingTimeoutId);
        playingTimeoutId = null;
      }
      if (lastPlayingCell) {
        lastPlayingCell.classList.remove('playing', 'playing-correct', 'playing-wrong');
        lastPlayingCell = null;
      }

      if (currentHeldPosition && currentHeldPosition !== position) {
        stopHeldNote(currentHeldPosition);
      }
      currentHeldPosition = position;

      position.stopHeld?.();
      position.stopHeld = play(position.midi, null);
      
      if (game.phase === 'guess') {
        position.cell.classList.add('playing');
      }
    }

    function stopHeldNote(position) {
      if (!position) return;
      position.stopHeld?.();
      position.stopHeld = null;
      position.cell.classList.remove('playing');
      if (currentHeldPosition === position) {
        currentHeldPosition = null;
      }
    }

    async function startGame() {
      questionTypeSelect.value = "chord"; noteCountSelect.value = "2";
      clearTimeout(judgmentTimer);
      endGesture();
      ensureAudio();
      activeVoices.forEach(stop => stop());
      clearBoardMarks();
      replayButton.textContent = t('replayBtn');
      const mode = questionTypeSelect.value;
      let q;

      if (mode === 'chord') {
        targetLabel.textContent = t('chordTitleLabel');
        const count = parseInt(noteCountSelect.value, 10);
        const isRootFirst = appSettings.firstNote === 'root';
        q = makeChordQuestion(count, isRootFirst);
      } else if (mode === 'melody') {
        targetLabel.textContent = t('chordTitleLabel');
        q = makeMelodyQuestion();
      } else {
        targetLabel.textContent = t('scaleTitleLabel');
        q = makeScaleQuestion();
      }

      game = { 
        mode,
        phase: 'playing', 
        target: q.sequence, 
        answers: [], 
        titleName: q.titleName, 
        displayKey: q.displayKey,
        rootPitchIndex: q.rootPitchIndex,
        chordMidiNotes: q.chordMidiNotes,
        guitarChordForm: q.guitarChordForm || null
      };

      targetTitle.textContent = mode !== 'scale' ? questionTitle() : q.displayKey;
      updateDeckCounterDisplay();
      updateStartButton();
      centerPosition(game.target[0]);
      await playQuestion(mode === 'chord' || mode === 'melody', mode === 'scale');
    }

    startButton.addEventListener('click', () => runPlayback(startGame));

    replayButton.addEventListener('click', () => runPlayback(async () => {
      if (game.phase === 'guess') {
        game.answers = [];
        positions.forEach(p => p.cell.classList.remove('selected'));
        await playQuestion();
      } else if (game.phase === 'result') {
        await playQuestion();
      }
    }));

    function buildFretboard() {
      svg.replaceChildren();
      positions.length = 0;
      boardHeight = strings.length * 55;
      svg.setAttribute('viewBox', `0 0 1020 ${boardHeight + 120}`);
      document.body.dataset.instrument = instrumentMode;
    svg.append(node('rect', { x: x0, y: y0, width: boardWidth, height: boardHeight, fill: '#4c2d20' }));
    for (let fret = 0; fret <= frets; fret++) {
      const x = fretX(fret);
      svg.append(node('line', { x1: x, y1: y0, x2: x, y2: y0 + boardHeight, stroke: fret === 0 ? '#f2ddba' : '#8f8174', 'stroke-width': fret === 0 ? 10 : 3 }));
    }
    [3, 5, 7, 9, 15].forEach(fret => svg.append(node('circle', { cx: (fretX(fret - 1) + fretX(fret)) / 2, cy: y0 + boardHeight / 2, r: 7, fill: '#e8c792' })));
    [y0 + boardHeight / 4, y0 + boardHeight * 3 / 4].forEach(y => svg.append(node('circle', { cx: (fretX(11) + fretX(12)) / 2, cy: y, r: 7, fill: '#e8c792' })));

    rootMarkerGroup = node('g', { id: 'root-markers' });
    svg.append(rootMarkerGroup);

    strings.forEach((string, index) => {
      const y = y0 + 28 + index * 55;
      svg.append(node('line', { x1: 76, y1: y, x2: x0 + boardWidth, y2: y, stroke: '#cbc0ad', 'stroke-width': 2.5 + index * (strings.length === 6 ? .84 : 1.4) }));
      const name = node('text', { x: 66, y: y + 5, class: 'string-name' });
      name.textContent = string.label;
      svg.append(name);
      
      for (let fret = 0; fret <= frets; fret++) {
        const left = fret === 0 ? x0 - 74 : fretX(fret - 1);
        const right = fretX(fret);
        const cell = node('g', { class: 'cell', tabindex: '0', role: 'button', 'aria-label': `${string.number}弦 ${string.name} ${fret}フレット ${noteName(string.midi + fret)}` });
        cell.append(node('rect', { x: left, y: y - 25, width: right - left, height: 50, rx: 2 }));
        
        const position = { 
          cell, 
          string, 
          fret, 
          midi: string.midi + fret,
          cx: (left + right) / 2,
          cy: y
        };
        positions.push(position);
        
        cell.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          if (event.repeat || game.phase === 'playing') return;
          pressPosition(position);
        });
        cell.addEventListener('keyup', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            stopHeldNote(position);
          }
        });
        cell.addEventListener('blur', () => stopHeldNote(position));
        svg.append(cell);
      }
    });

      updateInstrumentTexts();
    }
    buildFretboard();

    const boardShell = document.querySelector('.board-shell');
    const scrollPad = document.querySelector('#scroll-pad');
    let gesture = null;
    let scrollGesture = null;

    function setBoardScroll(left) {
      const max = Math.max(0, boardShell.scrollWidth - boardShell.clientWidth);
      boardShell.scrollLeft = Math.max(0, Math.min(max, left));
    }
    function centerPosition(position) {
      if (!position) return;
      const viewportHalfWidth = boardShell.clientWidth / 2;
      let center = position;
      if (game.mode === 'scale') {
        const offset = position.string.number <= Math.ceil(strings.length / 2) ? -1 : 1;
        const adjacentFret = Math.max(0, Math.min(frets, position.fret + offset));
        center = positions.find(p => p.string === position.string && p.fret === adjacentFret) || position;
      }
      // The left SVG margin is physically clipped; scrolling stops at the board edge.
      const matrix = svg.getScreenCTM();
      if (!matrix) return;
      const point = new DOMPoint(center.cx, center.cy).matrixTransform(matrix);
      const left = boardShell.scrollLeft + point.x - boardShell.getBoundingClientRect().left - viewportHalfWidth;
      setBoardScroll(game.mode === 'chord' && position.fret <= 2 ? 0 : left);
    }
    function pressPosition(position) {
      if (game.phase === 'playing') return;
      try {
        const ctx = ensureAudio();
        if (ctx.state !== 'running') ctx.resume().catch(recoverPlayback);
        // No long-press timer or release wait: schedule sound in this input event.
        startHeldNote(position);
        choose(position);
      } catch (error) {
        recoverPlayback(error);
      }
    }
    function endGesture() {
      if (!gesture) return;
      const current = gesture;
      gesture = null;
      stopHeldNote(current.position);
    }
    ['touchstart', 'touchmove', 'contextmenu', 'selectstart', 'dragstart'].forEach(type => {
      [boardShell, scrollPad].forEach(surface => {
        surface.addEventListener(type, event => { if (event.cancelable) event.preventDefault(); }, { passive:false });
      });
    });
    boardShell.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      endGesture();
      if (game.phase === 'playing') return;
      const position = positions.find(p => p.cell === event.target.closest('.cell'));
      if (!position) return;
      gesture = { id:event.pointerId, position };
      boardShell.setPointerCapture(event.pointerId);
      pressPosition(position);
    });
    boardShell.addEventListener('pointerup', event => { if (gesture?.id === event.pointerId) endGesture(); });
    boardShell.addEventListener('pointercancel', () => endGesture());
    boardShell.addEventListener('lostpointercapture', () => endGesture());

    scrollPad.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      scrollPad.setPointerCapture(event.pointerId);
      scrollGesture = { id:event.pointerId, x:event.clientX, left:boardShell.scrollLeft };
    });
    scrollPad.addEventListener('pointermove', event => {
      if (!scrollGesture || scrollGesture.id !== event.pointerId) return;
      setBoardScroll(scrollGesture.left - (event.clientX - scrollGesture.x));
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
      scrollPad.addEventListener(type, () => { scrollGesture = null; });
    });
    scrollPad.addEventListener('keydown', event => {
      const offsets = { ArrowLeft:-60, ArrowRight:60, Home:-Infinity, End:Infinity };
      if (!(event.key in offsets)) return;
      event.preventDefault();
      setBoardScroll(boardShell.scrollLeft + offsets[event.key]);
    });
    window.addEventListener('blur', () => {
      endGesture(); scrollGesture = null;
      stopHeldNote(currentHeldPosition);
      activeVoices.forEach(stop => stop());
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        endGesture(); scrollGesture = null;
        stopHeldNote(currentHeldPosition);
        activeVoices.forEach(stop => stop());
      }
    });
    // Keep scrolling within the actual board after a viewport resize.
    window.addEventListener('resize', () => setBoardScroll(boardShell.scrollLeft));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') settingsPopup.classList.remove('active'); });

  </script>
